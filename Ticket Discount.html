<!DOCTYPE html>
<html>
<head>
  <title>Metro Fare</title>
</head>
<body>
  <h2>Metro Ticket Fare</h2>

  Age: <input type="number" id="age"><br><br>
  Gender:
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select><br><br>
  <button onclick="show()">Calculate</button>
  <p id="result"></p>

  <script>
    // ---- your original code, unchanged ----
    function metroFare(baseFare, age, gender) {
      let discount = 0; // percentage

      if (gender.toLowerCase() === "female") {
        discount = Math.max(discount, 50);
      }

      if (age < 5) {
        discount = Math.max(discount, 100);   // free
      } else if (age <= 8) {
        discount = Math.max(discount, 50);    // half ticket
      }

      if (age > 65) {
        discount = Math.max(discount, 70);    // pays only 30%
      }

      return baseFare * (1 - discount / 100);
    }

    console.log(metroFare(40, 30, "female")); // 20
    console.log(metroFare(40, 4, "male"));    // 0
    console.log(metroFare(40, 70, "female")); // 12
    console.log(metroFare(40, 7, "male"));    // 20
    // ---- end of original code ----

    // only this part is new: it calls your function
    function show() {
      var age = Number(document.getElementById("age").value);
      var gender = document.getElementById("gender").value;
      document.getElementById("result").innerText =
        "Fare: ₹" + metroFare(40, age, gender);
    }
  </script>
</body>
</html>
